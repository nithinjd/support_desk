[pytest]
# The service modules sit flat in python-service/, so the rootdir goes on the
# import path rather than requiring an installed package.
pythonpath = .
testpaths = tests
# cacheprovider is disabled because OneDrive-synced folders intermittently
# deny the atomic rename pytest uses to write .pytest_cache.
addopts = -ra --strict-markers -p no:cacheprovider
markers =
    corpus: requires data/policies.json and data/requests (run seed_data.py first)
